name: Build Server Jar

# Builds a ready-to-run Paper server jar (paperclip, 1.21.11) that has the
# VLESS over WebSocket proxy, reverse tunnel client, Telegram notifications
# and the Komari monitoring probe compiled directly into it.
#
# Trigger it from the Actions tab ("Run workflow"), then download the
# "paper-1.21.11-server" artifact.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Apply patches
        run: ./gradlew applyPatches --stacktrace

      - name: Build paperclip jar
        run: ./gradlew createMojmapPaperclipJar --stacktrace

      - name: Rename artifact
        run: |
          JAR=$(find paper-server/build/libs -name 'paper-paperclip-*-mojmap.jar' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "::error::paperclip jar not found"
            find paper-server/build/libs -name '*.jar' -exec ls -lh {} \;
            exit 1
          fi
          cp "$JAR" paper-server.jar
          ls -lh paper-server.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-1.21.11-server
          path: paper-server.jar
          if-no-files-found: error

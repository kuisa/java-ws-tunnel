name: Build Server

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Apply patches
        run: ./gradlew applyPatches --stacktrace

      - name: Build paperclip jar
        run: ./gradlew createMojmapPaperclipJar --stacktrace

      - name: Collect jar
        run: |
          JAR=$(find paper-server/build/libs -name 'paper-paperclip-*-mojmap.jar' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "::error::paperclip jar not found"
            find paper-server/build/libs -name '*.jar' -exec ls -lh {} \;
            exit 1
          fi
          cp "$JAR" paper-server.jar
          ls -lh paper-server.jar

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Paper 1.21.11 server jar with VLESS-over-WS proxy, tunnel client,
            Telegram notifier and Komari probe built in.
            Commit: ${{ github.sha }}
          files: paper-server.jar
          fail_on_unmatched_files: true
